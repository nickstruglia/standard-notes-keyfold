name: Deploy to GitHub Pages

# Publishes the editor and its ext.json manifest from the default branch.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# Everyone who installs the plugin runs whatever this workflow publishes, so
# the build job gets read-only permissions and no dependency install scripts;
# only the small deploy job can write to Pages.

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Package offline zip for Standard Notes desktop
        run: |
          mkdir -p pkg
          cp -r dist/. pkg/
          node -e "const p=require('./package.json');console.log(JSON.stringify({name:p.name,version:p.version,sn:p.sn},null,2))" > pkg/package.json
          (cd pkg && zip -qr ../dist/keyfold.zip .)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
