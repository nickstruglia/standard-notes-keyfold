name: Deploy to GitHub Pages

# Publishes the editor and its ext.json manifest from the default branch.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Package offline zip for Standard Notes desktop
        run: |
          mkdir -p pkg
          cp -r dist/. pkg/
          node -e "const p=require('./package.json');console.log(JSON.stringify({name:p.name,version:p.version,sn:p.sn},null,2))" > pkg/package.json
          (cd pkg && zip -qr ../dist/sn-crypto.zip .)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
