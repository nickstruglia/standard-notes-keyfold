name: Deploy to GitHub Pages

# Publishes the editor and its ext.json manifest from the default branch.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# Everyone who installs the plugin runs whatever this workflow publishes, so
# the build job gets read-only permissions and no dependency install scripts;
# only the small deploy job can write to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Typecheck, unit tests and the browser tests must pass before anything is built for release.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Package offline zip for Standard Notes desktop
        run: |
          mkdir -p pkg
          cp -r dist/. pkg/
          # The desktop app compares this version with ext.json's to decide when to update.
          node -e "const p=require('./package.json');const v=require('./dist/ext.json').version;console.log(JSON.stringify({name:p.name,version:v,sn:p.sn},null,2))" > pkg/package.json
          (cd pkg && zip -qr ../dist/keyfold.zip .)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
