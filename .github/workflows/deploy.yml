name: Deploy to GitHub Pages

# Publishes the editor and its ext.json manifest from the default branch.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# Everyone who installs the plugin runs whatever this workflow publishes, so
# the build job gets read-only permissions and no dependency install scripts;
# only the small deploy job can write to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Typecheck, unit tests and the browser tests must pass before anything is built for release.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Package offline zip for Standard Notes desktop
        run: |
          mkdir -p pkg
          cp -r dist/. pkg/
          # The desktop app compares this version with ext.json's to decide when to update.
          node -e "const p=require('./package.json');const v=require('./dist/ext.json').version;console.log(JSON.stringify({name:p.name,version:v,sn:p.sn},null,2))" > pkg/package.json
          (cd pkg && zip -qr ../dist/keyfold.zip .)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
